  <text x="600" y="138" fill="#123768" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="6" font-weight="700" text-anchor="middle">OFFICIAL CERTIFICATE</text>
  <text x="600" y="198" fill="#0b1f3f" font-family="Georgia, serif" font-size="36" font-style="italic" font-weight="700" text-anchor="middle">Certificate of Attendance</text>

