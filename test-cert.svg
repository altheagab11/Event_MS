      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#f3f6fb" />
    </linearGradient>
  </defs>

  <rect width="1200" height="848" fill="#1d4f9c" />
  <rect x="8" y="8" width="1184" height="832" fill="#123768" />
  <rect x="16" y="16" width="1168" height="816" fill="url(#panelGradient)" />

  <rect x="36" y="36" width="1128" height="776" fill="none" stroke="#60a5fa" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="752" fill="none" stroke="#dde6f3" stroke-width="1" />

  <text x="600" y="470" fill="#dce6f5" font-family="Segoe UI, Arial, sans-serif" font-size="220" font-weight="800" letter-spacing="28" text-anchor="middle" opacity="0.55">EMS</text>

  <text x="72" y="88" font-size="28" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif">&#9670;</text>
  <text x="1128" y="88" text-anchor="end" font-size="28" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif">&#9670;</text>

