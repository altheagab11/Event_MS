  <text x="600" y="230" fill="#0052c9" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">&#9670;</text>
  <line x1="680" y1="222" x2="780" y2="222" stroke="#60a5fa" stroke-width="2" />

  <text x="600" y="288" fill="#516a92" font-family="Georgia, serif" font-size="20" text-anchor="middle">This is to certify that</text>
  <text x="600" y="368" fill="#0b1f3f" font-family="Georgia, serif" font-size="48" font-style="italic" font-weight="700" text-anchor="middle">Althea Gabrielle Reyes</text>
  <text x="600" y="428" fill="#516a92" font-family="Georgia, serif" font-size="20" text-anchor="middle">has attended</text>
  <text x="600" y="478" fill="#0052c9" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">ahhahahahahah</text>
  <text x="600" y="528" fill="#2e4672" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">held and concluded on May 27, 2026</text>
  <text x="600" y="590" fill="#60789f" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">Awarded in recognition of verified event attendance.</text>

